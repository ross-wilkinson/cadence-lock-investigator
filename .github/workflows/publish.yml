name: Publish run

on:
  workflow_dispatch:
    inputs:
      garmin_flag:
        description: "Cadence-lock verdict for Garmin (or whichever device fills its slot - see publish_polar_run.py)"
        type: choice
        options: [unreviewed, negative, positive_cadence, positive_lag, positive_blunder]
        default: unreviewed
      fitbit_flag:
        description: "Cadence-lock verdict for Fitbit"
        type: choice
        options: [unreviewed, negative, positive_cadence, positive_lag, positive_blunder]
        default: unreviewed

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Publish run
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          HR_MAX: ${{ secrets.HR_MAX }}
          BIRTH_YEAR: ${{ secrets.BIRTH_YEAR }}
        run: python publish_run.py --garmin-flag "${{ inputs.garmin_flag }}" --fitbit-flag "${{ inputs.fitbit_flag }}"

      - name: Commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Publish run (garmin=${{ inputs.garmin_flag }}, fitbit=${{ inputs.fitbit_flag }})"
          git push
